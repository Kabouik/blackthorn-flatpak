app-id: com.blackthorn.daoc.Launcher
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'

# Provides node/npm during the build (not included in freedesktop SDK by default)
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20

command: blackthorn-launcher

# Electron apps bundle their own locale files — splitting them would break the app
separate-locales: false

# appstream-compose is not available inside the flatpak-github-actions Docker
# image; build-update-repo handles AppStream composition on the host instead.
appstream-compose: false

# i386 compat extensions — required for 32-bit wine support (game client is 32-bit).
# Users will be prompted to install these on first run if missing.
add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: '24.08'
  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: '1.4'
    versions: '24.08;1.4'
    subdirectories: true
    autodelete: false

build-options:
  env:
    # Put node/npm from the SDK extension first on PATH
    PATH: /usr/lib/sdk/node20/bin:/app/bin:/usr/bin
    # flatpak-node-generator populates these directories via generated-sources.json.
    # @electron/get resolves its cache root via env-paths('electron'), which on Linux
    # returns $XDG_CACHE_HOME/electron. Setting XDG_CACHE_HOME here makes it resolve
    # to flatpak-node/cache/electron — exactly where generated-sources.json places the
    # hash-bucketed electron zip (flatpak-node/cache/electron/{sha256hash}/…).
    # ELECTRON_BUILDER_CACHE is for electron-builder's own tool cache (fpm, 7zip…).
    XDG_CACHE_HOME: /run/build/blackthorn-launcher/flatpak-node/cache
    ELECTRON_BUILDER_CACHE: /run/build/blackthorn-launcher/flatpak-node/cache
    npm_config_cache: /run/build/blackthorn-launcher/flatpak-node/npm-cache
    HOME: /run/build/blackthorn-launcher
    CI: 'true'
    # Skip the electron npm package's postinstall download; electron-builder
    # fetches the binary itself via @electron/get (cache resolved by XDG_CACHE_HOME).
    ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    # Playwright downloads Chromium during npm install; we don't need it here
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

finish-args:
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --share=network           # patch downloads, SignalR hub
  - --device=dri
  - --socket=pulseaudio
  # btui_cef_host is a native Linux CEF binary spawned directly inside the
  # sandbox. CEF needs user namespaces (CLONE_NEWUSER) for its own internal
  # renderer sandbox. --allow=devel permits this without giving full root.
  - --allow=devel
  # 32-bit wine support
  - --allow=multiarch
  # The game client path is set by the user in launcher settings and is not
  # known at package time. Wine prefixes live under $HOME by default.
  # Users with a game install outside $HOME can add a per-user override via
  #   flatpak override --user --filesystem=/path/to/game com.blackthorn.daoc.Launcher
  - --filesystem=home
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/tmp
  - --filesystem=/run/media
  - --talk-name=org.freedesktop.Notifications
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.la'
  - '*.a'

modules:
  - name: wine
    buildsystem: simple
    build-commands:
      - tar xf wine-11.0-staging-amd64-wow64.tar.xz
      - mv wine-11.0-staging-amd64-wow64 /app/wine
      # Mount-point directories for i386 compat extensions
      - install -d /app/lib/i386-linux-gnu
      - install -d /app/lib/i386-linux-gnu/GL
      # Convenience wrapper so users can run: flatpak run --command=winecfg ...
      - install -Dm755 winecfg.sh /app/bin/winecfg
    sources:
      - type: file
        url: https://github.com/Kron4ek/Wine-Builds/releases/download/11.0/wine-11.0-staging-amd64-wow64.tar.xz
        sha256: e6538a417dd2e7f738ad77addf74bfd9e45c9d970653674f93bde2df29055f2f
      - type: script
        dest-filename: winecfg.sh
        commands:
          - exec /app/wine/bin/wine winecfg "$@"

  - name: blackthorn-launcher
    buildsystem: simple
    build-commands:
      # Bundle the CEF runtime so the launcher uses it directly from the package
      # instead of downloading from CDN. electron-builder copies build/cef-runtime/
      # to resources/cef-runtime/ where the launcher reads it as embeddedRoot.
      - mkdir -p build/cef-runtime
      - cp btui-cef-linux-x64-1.0.43.zip build/cef-runtime/
      - |
        printf '%s\n' '{"version":"1.0.43","platform":"linux","architecture":"x64","protocolVersion":4,"registryVersion":6,"archiveUrl":"https://client.blackthorn-daoc.com/cef/linux-x64/btui-cef-linux-x64-1.0.43.zip","archiveFile":"btui-cef-linux-x64-1.0.43.zip","sha256":"167df186efc837c9ad69af7aecf4b48986828a639bf956f90b917687f2654a42"}' > build/cef-runtime/manifest.json

      # Install npm dependencies from the offline cache produced by setup.sh
      - npm ci --offline

      # Build TypeScript frontend (Vite), type-check the Electron host, then
      # compile and bundle the Electron main/preload processes with esbuild
      - npm run electron:build

      # Patch electron-builder.yml in the sandbox (real project file unchanged):
      #   electronDist — use the pre-downloaded zip so @electron/get is bypassed
      #                  entirely (avoids mandatory SHASUMS256.txt network fetch).
      #   linux.target  — restrict to "dir" only so AppImage/deb/rpm targets are
      #                   not attempted (they would need to download tools from GitHub).
      - |
        node -e "
        const fs = require('fs');
        const yaml = require('js-yaml');
        const cfg = yaml.load(fs.readFileSync('electron-builder.yml', 'utf8'));
        cfg.electronDist = 'flatpak-node/cache/electron/electron-v22.3.27-linux-x64.zip';
        cfg.linux = Object.assign({}, cfg.linux, { target: [{ target: 'dir', arch: ['x64'] }] });
        fs.writeFileSync('electron-builder.yml', yaml.dump(cfg));
        "

      # Package as an unpacked directory — no AppImage/deb/rpm needed inside
      # the Flatpak sandbox
      - npx --no electron-builder --linux --publish=never

      # Install the unpacked app; the version comes from package.json
      - |
        VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
        install -d /app/lib/launcher
        cp -ra "artifacts/electron/${VERSION}/linux-unpacked/." /app/lib/launcher/

      # electron-builder uses executableName verbatim; rename to drop the space
      - mv '/app/lib/launcher/Blackthorn Launcher' /app/lib/launcher/blackthorn-launcher

      # Wrapper script, desktop entry, icon, AppStream metadata
      - install -Dm755 flatpak/blackthorn-launcher.sh /app/bin/blackthorn-launcher
      - install -Dm644 build/icons/icon.png
          /app/share/icons/hicolor/512x512/apps/com.blackthorn.daoc.Launcher.png
      - install -Dm644 flatpak/com.blackthorn.daoc.Launcher.desktop
          /app/share/applications/com.blackthorn.daoc.Launcher.desktop
      - install -Dm644 flatpak/com.blackthorn.daoc.Launcher.metainfo.xml
          /app/share/metainfo/com.blackthorn.daoc.Launcher.metainfo.xml

    sources:
      # Launcher source tree (excludes build artefacts and the flatpak dir itself
      # to avoid pulling in generated-sources.json twice)
      - type: dir
        path: ..
        skip:
          - .git
          - node_modules
          - artifacts
          - build/cef-runtime
          - build/native-tests

      # Bundled CEF runtime — extracted by the launcher on first run to XDG_DATA_HOME.
      # Update version, sha256, and manifest.json in build-commands together when bumping.
      - type: file
        url: https://client.blackthorn-daoc.com/cef/linux-x64/btui-cef-linux-x64-1.0.43.zip
        sha256: 167df186efc837c9ad69af7aecf4b48986828a639bf956f90b917687f2654a42

      # npm dependency sources + Electron binary — generated by flatpak/setup.sh using
      # flatpak-node-generator. Must be (re-)generated when package-lock.json
      # changes and the result committed to the repository.
      - generated-sources.json
