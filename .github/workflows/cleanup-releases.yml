- name: Delete releases older than 5 days (always keep the latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_AGE_DAYS: 5
        run: |
          set -euo pipefail

          cutoff=$(date -u -d "-${MAX_AGE_DAYS} days" +%s)
          echo "Cutoff timestamp: $cutoff ($(date -u -d "-${MAX_AGE_DAYS} days" --iso-8601=seconds))"

          # Fetch all releases (paginated), sorted newest first by published_at
          # (fall back to created_at for drafts, which have no published_at)
          gh api "repos/${REPO}/releases" --paginate \
            --jq 'sort_by(.published_at // .created_at) | reverse | .[] | [.id, .tag_name, (.published_at // .created_at)] | @tsv' > releases.tsv || true

          if [ ! -s releases.tsv ]; then
            echo "No releases found."
            exit 0
          fi

          # Ask GitHub what it actually considers "latest" (excludes drafts/prereleases,
          # based on published_at) rather than assuming it's the newest row above.
          latest_id=$(gh api "repos/${REPO}/releases/latest" --jq '.id' 2>/dev/null || echo "")
          latest_tag=$(gh api "repos/${REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")

          if [ -n "$latest_id" ]; then
            echo "Latest release is '$latest_tag' (id=$latest_id) — will always be kept."
          else
            echo "No non-draft/non-prerelease release found; nothing will be protected as 'latest'."
          fi

          deleted_count=0

          while IFS=$'\t' read -r id tag created_at; do
            if [ -n "$latest_id" ] && [ "$id" = "$latest_id" ]; then
              echo "Release '$tag' (id=$id) is the latest release, keeping."
              continue
            fi

            created_ts=$(date -u -d "$created_at" +%s)

            if [ "$created_ts" -lt "$cutoff" ]; then
              echo "Release '$tag' (id=$id) created at $created_at is older than ${MAX_AGE_DAYS} days."

              if [ "$DRY_RUN" = "true" ]; then
                echo "  [dry-run] would delete release and tag '$tag'"
              else
                echo "  Deleting release id=$id"
                gh api -X DELETE "repos/${REPO}/releases/${id}"

                echo "  Deleting tag ref '$tag'"
                gh api -X DELETE "repos/${REPO}/git/refs/tags/${tag}" || \
                  echo "  (tag ref already gone or could not be deleted)"

                deleted_count=$((deleted_count + 1))
              fi
            else
              echo "Release '$tag' (id=$id) created at $created_at is within retention window, keeping."
            fi
          done < releases.tsv

          echo "Done. Deleted ${deleted_count} release(s)."
