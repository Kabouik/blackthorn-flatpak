name: Build Flatpak

# Triggers:
#   - Push to main: rebuilds on any packaging change (flatpak/ directory).
#   - Daily schedule: checks daoc-blackthorn/blackthorn for a new release and
#     skips if the latest upstream tag already has a packaging release here.
#   - workflow_dispatch: build a specific tag (or latest). Always creates a
#     new packaging revision even if the upstream tag was already packaged.
#
# Release tags in this repo follow the pattern vX.Y.Z-N where vX.Y.Z is the
# upstream launcher tag and N is the packaging revision (auto-incremented).
#
# Required secrets:
#   LAUNCHER_TOKEN — a PAT with read access to daoc-blackthorn/blackthorn.
# Optional secrets/variables for Cloudflare R2 repo publishing (flatpak update support):
#   FLATPAK_REPO_URL (variable), CF_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY

on:
  push:
    branches:
      - main
    paths:
      - 'flatpak/**'
      - '.github/workflows/flatpak.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream launcher tag to build, e.g. launcher-v0.30.16 (empty = latest)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'schedule' && 'build-flatpak-schedule' || github.run_id }}
  cancel-in-progress: true

jobs:
  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Resolve upstream tag and packaging revision
        id: release
        env:
          GH_TOKEN: ${{ secrets.LAUNCHER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.tag }}" ]; then
            UPSTREAM_TAG="${{ inputs.tag }}"
          else
            # This is a monorepo — filter to launcher releases only, since other
            # components (server, tools, ...) may also publish releases here.
            UPSTREAM_TAG=$(gh release list --repo daoc-blackthorn/blackthorn --limit 100 \
              --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("launcher-"))] | sort_by(.createdAt) | reverse | .[0].tagName')
          fi

          # Find the highest existing packaging revision for this upstream tag.
          LAST_REV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName \
            --jq "[.[] | .tagName | select(startswith(\"${UPSTREAM_TAG}-\")) \
                  | ltrimstr(\"${UPSTREAM_TAG}-\") | tonumber] | max // 0")
          NEXT_REV=$(( LAST_REV + 1 ))
          OUR_TAG="${UPSTREAM_TAG}-${NEXT_REV}"

          # On schedule/push: skip if this upstream tag already has a packaging release.
          EVENT="${{ github.event_name }}"
          if [[ "$EVENT" == "schedule" ]] && (( LAST_REV > 0 )); then
            echo "Already published ${UPSTREAM_TAG}-${LAST_REV}, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "our_tag=$OUR_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out packaging repo
        if: steps.release.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Check out launcher source at ${{ steps.release.outputs.upstream_tag }}
        if: steps.release.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: daoc-blackthorn/blackthorn
          ref: ${{ steps.release.outputs.upstream_tag }}
          token: ${{ secrets.LAUNCHER_TOKEN }}
          path: upstream

      - name: Overlay packaging files onto upstream source
        if: steps.release.outputs.skip != 'true'
        run: cp -r flatpak upstream/apps/launcher/flatpak

      - name: Resolve CEF runtime version from CDN and patch manifest
        if: steps.release.outputs.skip != 'true'
        run: |
          python3 - upstream/apps/launcher/flatpak/com.blackthorn.daoc.Launcher.yml << 'PY'
          import json, re, sys, urllib.request
          from pathlib import Path

          yml_path = Path(sys.argv[1])
          cef = json.loads(urllib.request.urlopen(
              "https://client.blackthorn-daoc.com/cef/linux-x64/manifest.json"
          ).read())

          version   = cef["version"]
          sha256    = cef["sha256"]
          url       = cef["archiveUrl"]
          archive   = f"btui-cef-linux-x64-{version}.zip"
          embedded  = json.dumps({
              "version": version, "platform": "linux", "architecture": "x64",
              "protocolVersion": cef["protocolVersion"],
              "registryVersion": cef["registryVersion"],
              "archiveUrl": url, "archiveFile": archive, "sha256": sha256,
          })

          # Use lambdas: re.sub interprets \n in plain replacement strings as a
          # newline, which would corrupt the printf line in the YAML.
          yml = yml_path.read_text()
          yml = re.sub(r'cp btui-cef-linux-x64-[\d.]+\.zip',
                       lambda _: f'cp {archive}', yml)
          new_printf = f"printf '%s\\n' '{embedded}'"
          yml = re.sub(r"printf '%s\\n' '\{[^']*\}'",
                       lambda _: new_printf, yml)
          yml = re.sub(
              r'(url: https://client\.blackthorn-daoc\.com/cef/linux-x64/)btui-cef-linux-x64-[\d.]+\.zip',
              lambda m: m.group(1) + archive, yml)
          yml = re.sub(
              r'(url: https://client\.blackthorn-daoc\.com/cef/linux-x64/btui-cef-linux-x64-[\d.]+\.zip\n\s+sha256: )[a-f0-9]{64}',
              lambda m: m.group(1) + sha256, yml)
          yml_path.write_text(yml)
          print(f"CEF {version} (protocol {cef['protocolVersion']}, registry {cef['registryVersion']})")
          PY

      - name: Stamp metainfo with upstream version and date
        if: steps.release.outputs.skip != 'true'
        run: |
          TAG="${{ steps.release.outputs.upstream_tag }}"
          VERSION="${TAG#launcher-}"
          VERSION="${VERSION#v}"
          DATE="$(date -u +%F)"
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"/>|<release version=\"${VERSION}\" date=\"${DATE}\"/>|" \
            upstream/apps/launcher/flatpak/com.blackthorn.daoc.Launcher.metainfo.xml

      - name: Cache npm offline sources
        if: steps.release.outputs.skip != 'true'
        id: sources-cache
        uses: actions/cache@v4
        with:
          path: upstream/apps/launcher/flatpak/generated-sources.json
          key: npm-sources-${{ hashFiles('upstream/apps/launcher/package-lock.json') }}

      - name: Generate npm offline sources for Flatpak
        if: steps.release.outputs.skip != 'true' && steps.sources-cache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet \
            "git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node"
          flatpak-node-generator --no-requests-cache npm upstream/apps/launcher/package-lock.json \
            -o upstream/apps/launcher/flatpak/generated-sources.json

      - name: Install flatpak and pre-install runtimes as root
        if: steps.release.outputs.skip != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y flatpak flatpak-builder appstream
          sudo flatpak remote-add --system --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system -y --noninteractive \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.node20//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Build Flatpak
        if: steps.release.outputs.skip != 'true'
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Blackthorn-Launcher-${{ steps.release.outputs.our_tag }}-linux-x64.flatpak
          manifest-path: upstream/apps/launcher/flatpak/com.blackthorn.daoc.Launcher.yml
          cache-key: flatpak-builder-${{ steps.release.outputs.upstream_tag }}

      - name: Publish OSTree repo to Cloudflare R2
        if: steps.release.outputs.skip != 'true' && vars.FLATPAK_REPO_URL != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          REPO_URL: ${{ vars.FLATPAK_REPO_URL }}
        run: |
          flatpak build-update-repo --prune --prune-depth=2 \
            --generate-static-deltas repo
          printf '[Flatpak Repo]\nTitle=Blackthorn DAOC\nUrl=%s/repo/\nDescription=Community Flatpak packaging for the Blackthorn DAOC launcher\n' \
            "$REPO_URL" > blackthorn.flatpakrepo
          aws s3 sync repo s3://blackthorn-flatpak/repo \
            --endpoint-url "$R2_ENDPOINT" --delete --no-progress
          aws s3 cp blackthorn.flatpakrepo s3://blackthorn-flatpak/blackthorn.flatpakrepo \
            --endpoint-url "$R2_ENDPOINT"

      - name: Re-bundle with repo URL for flatpak update support
        if: steps.release.outputs.skip != 'true' && vars.FLATPAK_REPO_URL != ''
        run: |
          flatpak build-bundle \
            --repo-url="${{ vars.FLATPAK_REPO_URL }}/repo/" \
            repo \
            "Blackthorn-Launcher-${{ steps.release.outputs.our_tag }}-linux-x64.flatpak" \
            com.blackthorn.daoc.Launcher

      - name: Upload Flatpak bundle
        if: steps.release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blackthorn-launcher-flatpak-${{ steps.release.outputs.our_tag }}
          path: Blackthorn-Launcher-*.flatpak
          if-no-files-found: error

      - name: Publish bundle to GitHub Releases
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAUNCHER_TOKEN: ${{ secrets.LAUNCHER_TOKEN }}
        run: |
          OUR_TAG="${{ steps.release.outputs.our_tag }}"
          UPSTREAM_TAG="${{ steps.release.outputs.upstream_tag }}"
          BUNDLE="Blackthorn-Launcher-${OUR_TAG}-linux-x64.flatpak"
          REPO_URL="${{ vars.FLATPAK_REPO_URL }}"

          # Find the previous upstream release to compute changelog range. This is a
          # monorepo — filter to launcher releases only, since other components
          # (server, tools, ...) may also publish releases here.
          PREV_UPSTREAM_TAG=$(GH_TOKEN="$LAUNCHER_TOKEN" gh release list \
            --repo daoc-blackthorn/blackthorn --limit 100 \
            --json tagName,createdAt \
            --jq "[.[] | select(.tagName != \"${UPSTREAM_TAG}\") \
                  | select(.tagName | startswith(\"launcher-\"))] \
                  | sort_by(.createdAt) | reverse | .[0].tagName // empty")

          {
            echo "Flatpak packaging of upstream launcher ${UPSTREAM_TAG}."
            echo ""
            if [ -n "$REPO_URL" ]; then
              echo "**Via repository (recommended):**"
              echo '```'
              echo "flatpak remote-add --user blackthorn ${REPO_URL}/blackthorn.flatpakrepo"
              echo "flatpak install --user blackthorn com.blackthorn.daoc.Launcher"
              echo '```'
              echo "Then use \`flatpak update\` to stay current."
              echo ""
              echo "**Via bundle:**"
            else
              echo "**Install:**"
            fi
            echo '```'
            echo "flatpak install --user ${BUNDLE}"
            echo '```'

            if [ -n "$PREV_UPSTREAM_TAG" ]; then
              echo ""
              echo "## Changelog (${PREV_UPSTREAM_TAG} → ${UPSTREAM_TAG})"
              echo '```'
              # This is a monorepo, so the plain tag..tag compare would include
              # commits from unrelated apps. Scope to apps/launcher by bounding
              # the commits-by-path listing to just after the previous tag's date.
              PREV_DATE=$(GH_TOKEN="$LAUNCHER_TOKEN" gh api \
                "repos/daoc-blackthorn/blackthorn/commits/${PREV_UPSTREAM_TAG}" \
                --jq '.commit.committer.date')
              SINCE=$(date -u -d "${PREV_DATE} +1 second" +%Y-%m-%dT%H:%M:%SZ)
              GH_TOKEN="$LAUNCHER_TOKEN" gh api --paginate \
                "repos/daoc-blackthorn/blackthorn/commits?sha=${UPSTREAM_TAG}&path=apps/launcher&since=${SINCE}&per_page=100" \
                --jq '.[] | "- \(.commit.message | split("\n")[0])"'
              echo '```'
            fi
          } > release-notes.md

          gh release create "$OUR_TAG" \
            --title "Blackthorn Launcher ${UPSTREAM_TAG} (Flatpak ${OUR_TAG##*-})" \
            --notes-file release-notes.md \
            "$BUNDLE"
