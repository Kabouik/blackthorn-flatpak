name: Build Flatpak

# Triggers:
#   - Push to main: rebuilds on any packaging change (flatpak/ directory).
#   - Daily schedule: checks daoc-blackthorn/launcher for a new release and
#     builds if the latest tag has changed since the previous run.
#   - workflow_dispatch: build a specific tag (or "latest" if left blank).
#
# Required secrets:
#   LAUNCHER_TOKEN — a PAT with read access to daoc-blackthorn/launcher.
# Optional secrets/variables for Cloudflare R2 repo publishing (flatpak update support):
#   FLATPAK_REPO_URL (variable), CF_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY

on:
  push:
    branches:
      - main
    paths:
      - 'flatpak/**'
      - '.github/workflows/flatpak.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag to build (empty = latest)'
        required: false
        default: ''

permissions:
  contents: write   # needed to create and upload GitHub Releases

jobs:
  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Resolve upstream release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.LAUNCHER_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(gh release view --repo daoc-blackthorn/launcher \
                    --json tagName --jq .tagName)
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out launcher source at ${{ steps.release.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: daoc-blackthorn/launcher
          ref: ${{ steps.release.outputs.tag }}
          token: ${{ secrets.LAUNCHER_TOKEN }}
          path: upstream

      - name: Overlay packaging files onto upstream source
        run: cp -r flatpak upstream/flatpak

      - name: Stamp metainfo with release version and date
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${TAG#v}"   # strip leading v if present
          DATE="$(date -u +%F)"
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"/>|<release version=\"${VERSION}\" date=\"${DATE}\"/>|" \
            upstream/flatpak/com.blackthorn.daoc.Launcher.metainfo.xml

      - name: Generate npm offline sources for Flatpak
        run: |
          pip install --quiet \
            "git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node"
          flatpak-node-generator --no-requests-cache npm upstream/package-lock.json \
            -o upstream/flatpak/generated-sources.json

      - name: Install flatpak and pre-install runtimes as root
        run: |
          sudo apt-get update -q
          sudo apt-get install -y flatpak flatpak-builder appstream
          sudo flatpak remote-add --system --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system -y --noninteractive \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.node20//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Blackthorn-Launcher-${{ steps.release.outputs.tag }}-linux-x64.flatpak
          manifest-path: upstream/flatpak/com.blackthorn.daoc.Launcher.yml
          cache-key: flatpak-builder-${{ steps.release.outputs.tag }}

      - name: Publish OSTree repo to Cloudflare R2
        # Requires secrets: CF_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
        # Bucket must have public access enabled; set FLATPAK_REPO_URL to its r2.dev URL.
        # If these secrets are absent the step is skipped (bundle-only install still works).
        if: >
          vars.FLATPAK_REPO_URL != '' &&
          secrets.CF_ACCOUNT_ID != '' &&
          secrets.R2_ACCESS_KEY_ID != '' &&
          secrets.R2_SECRET_ACCESS_KEY != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          REPO_URL: ${{ vars.FLATPAK_REPO_URL }}
        run: |
          flatpak build-update-repo --prune --prune-depth=2 \
            --generate-static-deltas repo
          printf '[Flatpak Repo]\nTitle=Blackthorn DAOC\nUrl=%s/repo/\nDescription=Community Flatpak packaging for the Blackthorn DAOC launcher\n' \
            "$REPO_URL" > blackthorn.flatpakrepo
          aws s3 sync repo s3://blackthorn-flatpak/repo \
            --endpoint-url "$R2_ENDPOINT" --delete --no-progress
          aws s3 cp blackthorn.flatpakrepo s3://blackthorn-flatpak/blackthorn.flatpakrepo \
            --endpoint-url "$R2_ENDPOINT"

      - name: Re-bundle with repo URL for flatpak update support
        if: vars.FLATPAK_REPO_URL != ''
        run: |
          flatpak build-bundle \
            --repo-url="${{ vars.FLATPAK_REPO_URL }}/repo/" \
            repo \
            "Blackthorn-Launcher-${{ steps.release.outputs.tag }}-linux-x64.flatpak" \
            com.blackthorn.daoc.Launcher

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: blackthorn-launcher-flatpak-${{ steps.release.outputs.tag }}
          path: Blackthorn-Launcher-*.flatpak
          if-no-files-found: error

      - name: Publish bundle to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          BUNDLE="Blackthorn-Launcher-${TAG}-linux-x64.flatpak"
          gh release create "$TAG" \
            --title "Blackthorn Launcher ${TAG}" \
            --notes "Linux Flatpak bundle.

          Install with:
            flatpak install ${BUNDLE}

          To update, download and re-run \`flatpak install\` with the new bundle." \
            "$BUNDLE" \
          || gh release upload "$TAG" "$BUNDLE" --clobber

